  ctx.fillStyle=bgSurf;ctx.beginPath();ctx.roundRect(0,0,W,H,8);ctx.fill();
  // Panel title
  ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillStyle=solidCol;
  ctx.fillText(SED_LABEL[sedKey],pad.l+pw/2,15);
  // Grid
  ctx.strokeStyle=gridCol;ctx.lineWidth=0.8;
  for(let i=0;i<=4;i++){const y=pad.t+ph*i/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+pw,y);ctx.stroke();}
  const toX=l=>pad.l+((l-lMin)/(lMax-lMin))*pw;
  const toY=f=>pad.t+ph*(1-Math.min(Math.max(f/pk,0),1.05));
  function shadeFill(fn,col,la,lb){
    ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(toX(Math.max(la,lMin)),pad.t+ph);
    for(let l=Math.max(la,lMin);l<=Math.min(lb,lMax);l+=STEP)ctx.lineTo(toX(l),toY(fn(l)*pk*0.88));
    ctx.lineTo(toX(Math.min(lb,lMax)),pad.t+ph);ctx.closePath();ctx.fill();
  }
  function shadeStroke(fn,col,dash){
    ctx.strokeStyle=col;ctx.lineWidth=1.3;ctx.setLineDash(dash||[]);
    ctx.beginPath();let first=true;
    for(let l=lMin;l<=lMax;l+=STEP){const ft=fn(l);if(ft<0.002)continue;
      const pt=[toX(l),toY(ft*pk*0.88)];if(first){ctx.moveTo(...pt);first=false;}else ctx.lineTo(...pt);}
    ctx.stroke();ctx.setLineDash([]);
  }
  shadeFill(filterSDSS_g,'rgba(60,160,60,0.18)',3800,5700);
  shadeFill(filterSDSS_r,'rgba(200,60,40,0.14)',5300,7400);
  shadeStroke(filterB,'rgba(50,145,50,0.55)',[4,3]);
  shadeStroke(filterR,'rgba(185,55,35,0.45)',[4,3]);
  shadeStroke(filterSDSS_g,'rgba(50,150,50,0.65)',[]);
  shadeStroke(filterSDSS_r,'rgba(190,55,35,0.6)',[]);
  // Filter labels inside top of plot
  ctx.font='10px sans-serif';ctx.textAlign='center';
  ctx.fillStyle='rgba(45,135,45,0.85)';ctx.fillText('SDSS g',toX(4770),pad.t+10);
  ctx.fillStyle='rgba(175,50,30,0.85)';ctx.fillText('SDSS r',toX(6220),pad.t+10);
  ctx.fillStyle='rgba(45,120,45,0.6)'; ctx.fillText('B',toX(4400),pad.t+20);
  ctx.fillStyle='rgba(165,45,25,0.55)';ctx.fillText('R',toX(6500),pad.t+20);
  // Lyman break — shaded region + line only, no label
  const lymanObs=912*(1+z);
  if(lymanObs>lMin&&lymanObs<lMax){
    ctx.fillStyle=isDark?'rgba(100,100,200,0.10)':'rgba(100,100,200,0.07)';
    ctx.fillRect(pad.l,pad.t,toX(lymanObs)-pad.l,ph);
    ctx.strokeStyle=isDark?'rgba(130,130,230,0.6)':'rgba(80,80,190,0.55)';
    ctx.lineWidth=1.2;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(toX(lymanObs),pad.t);ctx.lineTo(toX(lymanObs),pad.t+ph);ctx.stroke();
    ctx.setLineDash([]);
  }
  // NO 4000Å break line, NO Hα line
  // Rest-frame SED (dashed)
  ctx.strokeStyle=dashCol;ctx.lineWidth=1.8;ctx.setLineDash([6,4]);
  ctx.beginPath();let fr=true;
  for(let l=lMin;l<=lMax;l+=STEP){const pt=[toX(l),toY(interpSED(sed,l))];if(fr){ctx.moveTo(...pt);fr=false;}else ctx.lineTo(...pt);}
  ctx.stroke();ctx.setLineDash([]);
  // Redshifted SED (solid)
  ctx.strokeStyle=solidCol;ctx.lineWidth=2.2;
  ctx.beginPath();let fo=true;
  for(let l=lMin;l<=lMax;l+=STEP){const pt=[toX(l),toY(interpSED(sed,l/(1+z)))];if(fo){ctx.moveTo(...pt);fo=false;}else ctx.lineTo(...pt);}
  ctx.stroke();
  // X-axis
  const xTicks=[3000,4000,5000,6000,7000,8000,9000,10000];
  xTicks.forEach((lt,i)=>{
    const x=toX(lt);
    ctx.strokeStyle=isDark?'rgba(255,255,255,0.2)':'rgba(0,0,0,0.2)';ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(x,pad.t+ph);ctx.lineTo(x,pad.t+ph+4);ctx.stroke();
    ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillStyle=textSec;
    ctx.fillText(lt.toLocaleString(),x,pad.t+ph+(i%2===0?14:26));
  });
  ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillStyle=textSec;
  ctx.fillText('λ_obs (Å)',pad.l+pw/2,H-2);
  ctx.save();ctx.translate(11,pad.t+ph/2);ctx.rotate(-Math.PI/2);ctx.fillText('Relative flux',0,0);ctx.restore();
}

function drawKcorr(canvasId,band,title,z){
  const canvas=document.getElementById(canvasId);if(!canvas)return;
  const dpr=window.devicePixelRatio||1;
  const W=Math.round((figWidth()-10)/2),H=200;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  canvas.width=Math.round(W*dpr);canvas.height=H*dpr;
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  const pad={l:46,r:34,t:24,b:40};
  const pw=W-pad.l-pad.r,ph=H-pad.t-pad.b;
  ctx.fillStyle=bgSurf;ctx.beginPath();ctx.roundRect(0,0,W,H,8);ctx.fill();
  ctx.font='bold 11px sans-serif';ctx.textAlign='center';
  ctx.fillStyle=isDark?'#c8c7c0':'#2a2a28';
  ctx.fillText(title,pad.l+pw/2,15);
  const allVals=Object.values(KC[band]).flat();
  const yMin=Math.min(-0.5,Math.min(...allVals)-0.1);
  const yMax=Math.max(...allVals)+0.2;
  const toX=z=>pad.l+(z/Z_MAX)*pw;
  const toY=v=>pad.t+ph*((yMax-v)/(yMax-yMin));
  ctx.strokeStyle=gridCol;ctx.lineWidth=0.8;
  for(let v=Math.ceil(yMin*2)/2;v<=yMax;v+=0.5){ctx.beginPath();ctx.moveTo(pad.l,toY(v));ctx.lineTo(pad.l+pw,toY(v));ctx.stroke();}
  for(let zi=0;zi<=Z_MAX+0.001;zi+=0.2){ctx.beginPath();ctx.moveTo(toX(zi),pad.t);ctx.lineTo(toX(zi),pad.t+ph);ctx.stroke();}
  if(yMin<0&&yMax>0){
    ctx.strokeStyle=isDark?'rgba(255,255,255,0.2)':'rgba(0,0,0,0.18)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(pad.l,toY(0));ctx.lineTo(pad.l+pw,toY(0));ctx.stroke();
  }
  const tracks=[{key:'E',col:'#E24B4A'},{key:'Sbc',col:'#9085e9'},{key:'Scd',col:'#2a78d6'},{key:'Im',col:'#eda100'}];
  for(const {key,col} of tracks){
    ctx.strokeStyle=col;ctx.lineWidth=1.8;ctx.setLineDash([]);
    ctx.beginPath();let first=true;
    for(let i=0;i<KC.z.length;i++){const pt=[toX(KC.z[i]),toY(KC[band][key][i])];if(first){ctx.moveTo(...pt);first=false;}else ctx.lineTo(...pt);}
    ctx.stroke();
  }
  ctx.font='bold 10px sans-serif';ctx.textAlign='left';
  for(const {key,col} of tracks){ctx.fillStyle=col;ctx.fillText(key,pad.l+pw+4,toY(KC[band][key][KC[band][key].length-1])+4);}
  const xz=toX(z);
  ctx.strokeStyle=isDark?'rgba(255,255,255,0.4)':'rgba(0,0,0,0.3)';
  ctx.lineWidth=1.2;ctx.setLineDash([4,3]);
  ctx.beginPath();ctx.moveTo(xz,pad.t);ctx.lineTo(xz,pad.t+ph);ctx.stroke();ctx.setLineDash([]);
  for(const {key,col} of tracks){
    const v=interpKC(KC[band][key],z);
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(xz,toY(v),4,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=bgSurf;ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(xz,toY(v),4,0,Math.PI*2);ctx.stroke();
  }
  ctx.fillStyle=textSec;ctx.font='10px sans-serif';ctx.textAlign='center';
  for(let zt=0;zt<=Z_MAX+0.001;zt+=0.2)ctx.fillText(zt.toFixed(1),toX(zt),H-13);
  ctx.fillText('Redshift z',pad.l+pw/2,H-2);
  ctx.textAlign='right';
  for(let v=Math.ceil(yMin*2)/2;v<=yMax;v+=0.5){
    if(Math.abs(v%1)<0.01||Math.abs(v%1-0.5)<0.01)ctx.fillText(v.toFixed(1),pad.l-4,toY(v)+4);
  }
  ctx.save();ctx.translate(11,pad.t+ph/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.fillText('K (mag)',0,0);ctx.restore();
}

function drawColors(z){
  const canvas=document.getElementById('colorPlot');if(!canvas)return;
  const dpr=window.devicePixelRatio||1;
  const W=figWidth(),H=250;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  canvas.width=Math.round(W*dpr);canvas.height=H*dpr;
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  ctx.fillStyle=bgSurf;ctx.beginPath();ctx.roundRect(0,0,W,H,8);ctx.fill();
  const pad={l:52,r:40,t:14,b:46};
  const pw=W-pad.l-pad.r,ph=H-pad.t-pad.b;
  const cMin=-0.1,cMax=2.6;
  const toX=z=>pad.l+(z/Z_MAX)*pw;
  const toY=c=>pad.t+ph*((cMax-c)/(cMax-cMin));
  ctx.strokeStyle=gridCol;ctx.lineWidth=0.8;
  for(let c=0;c<=2.5;c+=0.5){ctx.beginPath();ctx.moveTo(pad.l,toY(c));ctx.lineTo(pad.l+pw,toY(c));ctx.stroke();}
  for(let zi=0;zi<=Z_MAX+0.001;zi+=0.2){ctx.beginPath();ctx.moveTo(toX(zi),pad.t);ctx.lineTo(toX(zi),pad.t+ph);ctx.stroke();}
  const tracks=[{key:'E',col:'#E24B4A'},{key:'Sbc',col:'#9085e9'},{key:'Scd',col:'#2a78d6'},{key:'Im',col:'#eda100'}];
  for(const {key,col} of tracks){
    ctx.strokeStyle=col;ctx.lineWidth=2;ctx.setLineDash([]);
    ctx.beginPath();let first=true;
    for(let i=0;i<OBS.z.length;i++){const pt=[toX(OBS.z[i]),toY(OBS[key][i])];if(first){ctx.moveTo(...pt);first=false;}else ctx.lineTo(...pt);}
    ctx.stroke();
  }
  ctx.font='bold 11px sans-serif';ctx.textAlign='left';
  for(const {key,col} of tracks){ctx.fillStyle=col;ctx.fillText(key,pad.l+pw+6,toY(OBS[key][OBS[key].length-1])+4);}
  const xz=toX(z);
  ctx.strokeStyle=isDark?'rgba(255,255,255,0.4)':'rgba(0,0,0,0.3)';
  ctx.lineWidth=1.2;ctx.setLineDash([4,3]);
  ctx.beginPath();ctx.moveTo(xz,pad.t);ctx.lineTo(xz,pad.t+ph);ctx.stroke();ctx.setLineDash([]);
  for(const {key,col} of tracks){
    const c=interpObs(key,z);
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(xz,toY(c),4.5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=bgSurf;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(xz,toY(c),4.5,0,Math.PI*2);ctx.stroke();
  }
  ctx.fillStyle=textSec;ctx.font='10px sans-serif';ctx.textAlign='center';
  for(let zt=0;zt<=Z_MAX+0.001;zt+=0.2)ctx.fillText(zt.toFixed(1),toX(zt),pad.t+ph+14);
  ctx.fillText('Redshift z',pad.l+pw/2,pad.t+ph+30);
  ctx.textAlign='right';
  for(const c of [0,0.5,1.0,1.5,2.0,2.5])ctx.fillText(c.toFixed(1),pad.l-5,toY(c)+4);
  ctx.save();ctx.translate(11,pad.t+ph/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.fillText('Observed g−r (mag)',0,0);ctx.restore();
}

function fmt(v){return(v>=0?'+':'')+v.toFixed(2)+' mag';}
function setLabel(id,band,sedKey){
  const sub=band==='gB'?'g→B':'r→R';
  document.getElementById(id).innerHTML=`K<sub>${sub}</sub> ${sedKey}`;
}
function updateReadout(){
  const z=parseFloat(document.getElementById('zSlider').value);
  for(let p=0;p<2;p++){
    const key=panelSED[p];
    setLabel(`lbl_kgb${p}`,'gB',key);
    setLabel(`lbl_krr${p}`,'rR',key);
    document.getElementById(`kgb${p}`).textContent=fmt(interpKC(KC.gB[key],z));
    document.getElementById(`krr${p}`).textContent=fmt(interpKC(KC.rR[key],z));
  }
}
function update(){
  const z=parseFloat(document.getElementById('zSlider').value);
  document.getElementById('zDisplay').textContent=z.toFixed(2);
  drawSpec(0,z);drawSpec(1,z);
  drawKcorr('kcorrGB','gB','K-correction: g → B',z);
  drawKcorr('kcorrRR','rR','K-correction: r → R',z);
  drawColors(z);
  updateReadout();
}
document.querySelectorAll('.sed-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const p=parseInt(btn.dataset.panel),sed=btn.dataset.sed;
    panelSED[p]=sed;
    document.querySelectorAll(`#sel${p} .sed-btn`).forEach(b=>b.className='sed-btn');
    btn.classList.add(`active-${sed}`);
    update();
  });
});
document.getElementById('zSlider').addEventListener('input',update);
let animId=null,animZ=0,animDir=1;
document.getElementById('playBtn').addEventListener('click',()=>{
  if(animId){cancelAnimationFrame(animId);animId=null;document.getElementById('playBtn').textContent='▶ Animate';document.getElementById('playBtn').classList.remove('active');}
  else{
    animZ=parseFloat(document.getElementById('zSlider').value);
    document.getElementById('playBtn').textContent='⏸ Pause';document.getElementById('playBtn').classList.add('active');
    function step(){
      animZ+=0.004*animDir;
      if(animZ>=Z_MAX){animZ=Z_MAX;animDir=-1;}if(animZ<=0){animZ=0;animDir=1;}
      document.getElementById('zSlider').value=animZ;update();animId=requestAnimationFrame(step);
    }
    animId=requestAnimationFrame(step);
  }
});
document.getElementById('resetBtn').addEventListener('click',()=>{
  if(animId){cancelAnimationFrame(animId);animId=null;document.getElementById('playBtn').textContent='▶ Animate';document.getElementById('playBtn').classList.remove('active');}
  animDir=1;document.getElementById('zSlider').value=0;update();
});
setTimeout(update,60);
window.addEventListener('resize',()=>requestAnimationFrame(update));
</script>
